name: CI

# Lint, type-check and test on every push and pull request.
#
# This workflow deliberately needs NO database and NO secrets. Everything it
# runs is either static analysis or a test that operates on files in the repo,
# so a fork can run it and a failure always means the code is wrong rather than
# the environment being unavailable.
#
# Ingestion and analysis run on their own schedules (added in M1), not here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -v

  web:
    name: web (next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # `defaults.run.working-directory` applies to `run:` steps only, never to
      # actions, so this reads the repo root unless told otherwise — and the root
      # has no package.json. Without it: "No pnpm version is specified", 5s in,
      # before Node is even installed. web/package.json holds packageManager, so
      # the version stays declared in exactly one place.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # No Supabase keys are provided. The build must succeed without them:
      # anything that reads live data has to degrade to an empty state rather
      # than fail, which is also the behaviour a visitor gets when a scrape
      # has not run yet.
      - name: Build
        run: pnpm build

  secrets:
    name: no service-role key in web/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SUPABASE_SERVICE_ROLE_KEY bypasses every RLS policy. If it ever reaches
      # the browser bundle, every raw snapshot, per-source price and unblinded
      # ground-truth candidate becomes public. Cheap check, catastrophic miss.
      #
      # The check inspects key VALUES, not the variable name. The name appears
      # under web/ in the comment that warns about it and in the runtime guard
      # that rejects it — grepping the string failed on its own defence, red on
      # every commit, which is how a check stops being read.
      - name: Assert no service-role credential is reachable from web/
        run: python3 scripts/assert_no_service_role.py

      # A guard nobody has watched fail is not known to work. This plants three
      # kinds of leak, asserts the scan catches all of them and leaves a real
      # anon key alone, then cleans up.
      - name: Assert the guard itself still catches a leak
        run: python3 scripts/assert_no_service_role.py --self-test

      - name: Assert no .env file is committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example'; then
            echo "::error::A .env file is tracked by git."
            exit 1
          fi
          echo "OK: no tracked .env files"
