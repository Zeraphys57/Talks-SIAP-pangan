name: CI

# Lint, type-check and test on every push and pull request.
#
# No secrets are used here, and nothing that can write to or bypass RLS is
# provided to any job. Two public repository *variables* are:
# NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY, because
# `pnpm build` prerenders 48 commodity pages and therefore has to read.
#
# So a red run does not always mean the code is wrong: it can also mean Supabase
# was unreachable. Read the log before assuming. That is a real cost, accepted
# because the alternative — making the data layer degrade to an empty state so
# the build never needs to read — would let a momentary outage ship a deploy
# where every commodity page 404s, with nothing failing to say so.
#
# Ingestion and analysis run on their own schedules (added in M1), not here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -v

  web:
    name: web (next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # `defaults.run.working-directory` applies to `run:` steps only, never to
      # actions, so this reads the repo root unless told otherwise — and the root
      # has no package.json. Without it: "No pnpm version is specified", 5s in,
      # before Node is even installed. web/package.json holds packageManager, so
      # the version stays declared in exactly one place.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # node --test with --experimental-strip-types: no test framework, no new
      # dependency. Covers the chart's segment builder, whose orphan-point case
      # cannot be reproduced from production data and so needs a fixture.
      - name: Test
        run: pnpm test

      # The build prerenders 48 commodity pages, so it reads Supabase, so it
      # needs the anon key. It cannot be made to work without one: dashboard.ts
      # fails loudly on a read error rather than degrading to an empty state,
      # and that is the right call — with `dynamicParams = false`, a
      # generateStaticParams that quietly returned [] would ship a deploy where
      # every commodity page 404s. A red build beats a silently empty site.
      #
      # These are repository VARIABLES, not secrets. The anon key is already
      # shipped in the browser bundle of the public dashboard and is constrained
      # by RLS; hiding it here would be theatre. Nothing that bypasses RLS is
      # provided to any job in this workflow.
      - name: Check the build inputs exist
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the repository variables NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY under Settings -> Secrets and variables -> Actions -> Variables. Both are public values, not secrets. Without them next build fails during 'Collecting page data' with advice about .env.local that does not apply on a runner."
            exit 1
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build

  secrets:
    name: no service-role key in web/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SUPABASE_SERVICE_ROLE_KEY bypasses every RLS policy. If it ever reaches
      # the browser bundle, every raw snapshot, per-source price and unblinded
      # ground-truth candidate becomes public. Cheap check, catastrophic miss.
      #
      # The check inspects key VALUES, not the variable name. The name appears
      # under web/ in the comment that warns about it and in the runtime guard
      # that rejects it — grepping the string failed on its own defence, red on
      # every commit, which is how a check stops being read.
      - name: Assert no service-role credential is reachable from web/
        run: python3 scripts/assert_no_service_role.py

      # A guard nobody has watched fail is not known to work. This plants three
      # kinds of leak, asserts the scan catches all of them and leaves a real
      # anon key alone, then cleans up.
      - name: Assert the guard itself still catches a leak
        run: python3 scripts/assert_no_service_role.py --self-test

      # The muted text colour was written inline in 52 places and was 4.17:1 on
      # the dark background — below WCAG AA — because there was no single
      # definition to diverge from. web/src/lib/ui.ts is now that definition.
      - name: Assert the muted colour is not written inline
        run: python3 scripts/assert_ui_tokens.py

      - name: Assert that guard still catches a violation
        run: python3 scripts/assert_ui_tokens.py --self-test

      - name: Assert no .env file is committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example'; then
            echo "::error::A .env file is tracked by git."
            exit 1
          fi
          echo "OK: no tracked .env files"
