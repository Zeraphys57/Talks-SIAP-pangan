[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siap"
version = "0.1.0"
description = "SIAP-PANGAN analysis engine: ingestion, anomaly detection, clustering, seasonality, fusion, evaluation"
readme = "../README.md"
# 3.12 rather than 3.11: numpy's bundled type stubs use `type` statement syntax,
# which only parses on 3.12+. Claiming 3.11 support we do not type-check would be
# worse than stating the real floor. CI runs 3.12.
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tim RGB", email = "" }]

# Dependencies are added per milestone, not up front. M0 needs only
# configuration loading, a Postgres connection and a CLI. The scientific stack
# (pandas / scikit-learn / statsmodels / matplotlib) arrives with the milestone
# that first uses it, so `pip install` at any commit reflects what that commit
# actually runs.
dependencies = [
    # M0 — configuration, database, CLI
    "psycopg[binary]>=3.2",
    "PyYAML>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "click>=8.1",
    # M1 — ingestion
    "httpx>=0.27",           # HTTP client; explicit timeouts, connection limits
    "beautifulsoup4>=4.12",  # siskaperbapo / pihps / jogja return HTML fragments
    "lxml>=5.2",             # parser backend for the above
    "pytrends>=4.9",         # UNOFFICIAL Google Trends wrapper; best-effort only
    # M3 — anomaly detection
    "pandas>=2.2",           # series handling; rolling windows
    "numpy>=1.26",
    "scikit-learn>=1.5",     # IsolationForest, StandardScaler, KMeans (M4)
    # M5 — seasonal decomposition
    "statsmodels>=0.14",     # STL
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
siap = "siap.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/siap"]

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "db: test requires a live database connection (skipped when DATABASE_URL is unset)",
]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.isort]
known-first-party = ["siap"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# The scientific stack ships no type information. Ignoring the *imports* keeps
# strict checking on everything we write; it does not weaken our own code.
[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "pytrends.*", "statsmodels.*", "matplotlib.*"]
ignore_missing_imports = true
