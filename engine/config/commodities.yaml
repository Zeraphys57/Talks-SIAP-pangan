# Reference data: the 12 commodities tracked by SIAP-PANGAN.
# Seeded into the `commodities` table by `siap seed`.
#
# Fields
#   slug             stable identifier; used in URLs (/komoditas/<slug>) and joins.
#                    Never change one after data exists — it is a foreign key in
#                    everything downstream.
#   display_name     Bahasa Indonesia, sentence case, as shown to a warung owner.
#   canonical_unit   the unit every price is converted to during normalization.
#   plausible_price  hard guard against unit-conversion bugs (docs/architecture.md,
#                    "known traps"). A 10x error looks exactly like a finding, so
#                    normalization raises instead of inserting outside this band.
#                    Deliberately wide: this catches order-of-magnitude mistakes,
#                    NOT market anomalies. Anomaly detection is a separate concern.
#   trends_keywords  Indonesian search terms passed to pytrends for the demand
#                    signal. Order matters; the first is the primary term.
#   source_aliases   per-portal spellings of this commodity.
#
# ---------------------------------------------------------------------------
# ALIAS ORDER IS SIGNIFICANT.
#
# Several portals publish more than one variant that maps to a single commodity
# here — SP2KP has four cuts of beef, three cooking-oil products, two garlics.
# `price_observations` is UNIQUE on (commodity, source, region, date), so one of
# them has to win.
#
# Rule: **the first alias listed that is actually present in the response is the
# canonical one.** Later aliases are fallbacks, used only when the earlier ones
# are absent that day. Ingestion records which alias it used on every row, so the
# choice is auditable rather than buried. Alternatives that were present but not
# chosen are logged to the run notes.
#
# ---------------------------------------------------------------------------
# VERIFICATION STATUS (2026-07-28)
#   sp2kp        VERIFIED against /master/api/variant (56 active variants)
#   siskaperbapo VERIFIED against a live tabel.nodesign response (67 rows)
#   pihps        PROVISIONAL — endpoint located, commodity list not yet read
#   jogja        PROVISIONAL — blocked on CSRF session handling
#   panelharga   not applicable; source is_active=false (upstream outage)
# See docs/sources.md.

version: 2
updated: 2026-07-28

