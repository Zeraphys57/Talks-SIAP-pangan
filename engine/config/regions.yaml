# Reference data: geographic scopes tracked by SIAP-PANGAN.
# Seeded into the `regions` table by `siap seed`.
#
# Slug convention note: region slugs use underscores while commodity slugs use
# hyphens. That is the convention the build brief specifies (§4 lists
# `di_yogyakarta`; §8.3 routes `/komoditas/cabai-rawit-merah`). It is preserved
# deliberately rather than "corrected" — commodity slugs appear in public URLs,
# region slugs do not. Recorded in docs/changelog.md.
#
#   level        national | province | city
#   parent_slug  containing region, for roll-up display and coverage reporting
#   bps_code     Badan Pusat Statistik area code, for cross-referencing official
#                releases when annotators verify ground-truth evidence (M7)

