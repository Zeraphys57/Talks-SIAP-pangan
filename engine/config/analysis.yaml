# Analysis parameters. Nothing in a module body may hardcode any of these.
#
# Every value here is recorded into `analysis_runs.params` on each run, so a
# figure in the paper can be traced to the exact configuration that produced it.

version: 1
updated: 2026-07-29

# Single seed for every stochastic step. Isolation Forest, the M7 candidate
# shuffle and the K-Means initialisation all draw from it, so one number
# reproduces the whole pipeline.
seed: 20260729

# ---------------------------------------------------------------------------
# Shared input policy
# ---------------------------------------------------------------------------
input:
  # Imputed rows are excluded from both detectors.
  #
  # An interpolated value is a deterministic function of its two neighbours: it
  # carries no new information, and because it lies exactly on the line between
  # them it *reduces* the variance of any window containing it. A smaller
  # denominator inflates every z-score in that window, so including imputed
  # rows would manufacture anomalies. Scoring an invented value as anomalous
  # would be worse still.
  #
  # Consequence to keep in mind: in PIHPS-only regions roughly 2/7 of days are
  # imputed weekends, leaving ~21-22 real observations in a 30-day window —
  # just above the min_observations floor below.
  exclude_imputed: true

# ---------------------------------------------------------------------------
# 6.1 Z-Score — statistical baseline
# ---------------------------------------------------------------------------
zscore:
  # Trailing window: days t-30 .. t-1. Day t is NOT in its own baseline —
  # including it would let a spike partly cancel itself, which is the exact
  # leak that makes a naive rolling z-score under-detect.
  window_days: 30

  # Below this many real observations in the window, emit NULL rather than a
  # number computed from too little history.
  min_observations: 20

  # |z| at or above this is flagged. The proposal notes Z-Score's normality
  # assumption as its weakness; computing on log price is the mitigation, and
  # that choice belongs in the paper.
  threshold: 2.5

  # norm_score = clip(|z| / norm_divisor, 0, 1), so |z| >= 4 saturates at 1.
  norm_divisor: 4.0

  # Minimum baseline standard deviation, in log space, for a z-score to mean
  # anything. Below this the score is NULL.
  #
  # Why this exists: some sources carry a value forward between surveys instead
  # of resurveying. PIHPS does this — M2 found it pinned to the same rupiah for
  # days at a time — and in 2023 it was the *only* source for jawa_tengah and
  # di_yogyakarta. A 30-day window over a stale feed has a standard deviation of
  # about 1e-16, so the first real movement divides by nearly zero and scores
  # |z| in the millions. The first run produced z = -20,824,185.
  #
  # Those are not anomalies. A z-score against a baseline that was not updating
  # measures the source's publication cadence, not the market, and the honest
  # answer is that the detector cannot judge that window at all.
  #
  # 0.0005 in log space is a 0.05% daily standard deviation: below that a staple
  # food price has effectively not moved for a month, which no real market does.
  min_baseline_std: 0.0005

  # Prices are right-skewed and multiplicative; a 10% move costs the same in
  # log space at any level. This is the documented mitigation for the
  # normality assumption.
  use_log_price: true

# ---------------------------------------------------------------------------
# 6.2 Isolation Forest — multivariate
# ---------------------------------------------------------------------------
iforest:
  # Fitted per commodity x region, never globally: daging-sapi trades around
  # 130,000 and beras around 13,000, so one global model would spend its splits
  # separating commodities rather than finding anomalies within each.
  n_estimators: 200

  # Default only. M7 sweeps 0.01 / 0.03 / 0.05 on a held-out split — tuning
  # this against the reported labels would be leakage.
  contamination: 0.03

  min_observations: 60

  features:
    - log_price
    - pct_change_1d
    - pct_change_7d
    - rolling_std_14d
    - demand_z52
    - dow

  rolling_std_window: 14

  # Google Trends is currently throttled to zero, so demand_z52 is absent for
  # every row. Rather than dropping the feature (which would change the model
  # between runs depending on whether Trends happened to work), it is filled
  # with this constant and the substitution is recorded in the run notes.
  # A constant column contributes no splits, so the model behaves as if the
  # feature were absent — but reproducibly so.
  demand_missing_fill: 0.0

# ---------------------------------------------------------------------------
# 6.3 K-Means clustering
# ---------------------------------------------------------------------------
kmeans:
  # The unit of observation is commodity x region x MONTH, not commodity.
  #
  # Twelve commodities alone gives twelve points, and a silhouette score
  # computed on twelve points while searching k up to 8 is noise: adding or
  # dropping one commodity would swing the selected k, and there is no way to
  # tell real structure from an arbitrary partition of a tiny sample. Widening
  # the unit to (commodity, region, month) yields on the order of a thousand
  # cells, which makes the k-search and the silhouette curve defensible.
  #
  # It also changes what a cluster *means*: from the static and unfalsifiable
  # "cabai is a volatile commodity" to "cabai in DIY during March 2024 sat in a
  # high-volatility, rising regime". The same commodity can move between zones
  # across months, which is what the dashboard actually needs to say.

  # The full search is recorded, not just the winner: the elbow/silhouette curve
  # is a required paper figure and storing only k would make it unreproducible.
  k_min: 2
  k_max: 8

  # Selection floor, distinct from the search range.
  #
  # On the real data the silhouette prefers k=2 (0.7807 against 0.6504 for k=3),
  # because isolating the ~4% of extreme cells is trivially separable. But the
  # zone rule ranks clusters and takes the extremes, so k=2 has no middle rank
  # and `kuning` becomes unreachable — and worse, a month with 5% daily
  # volatility and a +25% rise falls into the calm cluster and reads hijau. For
  # a warung owner that is exactly backwards.
  #
  # "Do not force k=3" is read as "do not pin it at exactly 3": k is still free
  # to be 3, 4, 5, 6, 7 or 8, chosen by silhouette. It is not free to be 2,
  # because 2 cannot populate the three-zone output the same section specifies.
  #
  # k=2 is still fitted and still appears in the recorded curve and the paper
  # figure; it is excluded from *selection* only, and the write-up states that
  # it scored highest and why it was excluded. Decision taken at the M4 gate.
  k_select_min: 3

  n_init: 10
  max_iter: 300

  # A month needs enough real observations for a volatility estimate to mean
  # anything. Below this the cell is dropped rather than contributing a
  # standard deviation computed from a handful of days.
  min_days_in_month: 15

  # Below this many cells the clustering itself is not worth trusting.
  min_cells: 30

  # Post-hoc zone mapping. Clusters are ranked by
  #     0.5 * z(centroid_volatility) + 0.5 * z(centroid_cum_change)
  # highest -> merah, lowest -> hijau, everything between -> kuning.
  #
  # k is NOT forced to 3. When the silhouette selects k > 3 the middle clusters
  # merge into kuning, which is stated in docs/methods.md. This is what resolves
  # the proposal's contradiction between "find the optimal K" and "three zones".
  zone_weight_volatility: 0.5
  zone_weight_cum_change: 0.5
