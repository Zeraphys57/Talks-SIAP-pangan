# Exact dependency set for reproducing a published number.
#
# `pyproject.toml` declares compatible RANGES, which is right for development:
# a security patch to httpx should not need a commit here. This file records the
# EXACT versions a run was made with, which is what a reader needs to reproduce
# it — `>=1.5` does not identify the scikit-learn that produced a figure.
#
# Both are true at once and neither replaces the other. pyproject says what the
# project works with; this says what the numbers came from.
#
# Regenerate deliberately, not automatically:
#
#     pip freeze --exclude-editable | sort > requirements.lock
#
# and re-run `siap reproduce` afterwards. If scores move, the library change is
# the finding — record it in docs/changelog.md rather than quietly relocking.
#
# To reproduce exactly:
#
#     python -m venv .venv && .venv/Scripts/activate
#     pip install -r requirements.lock
#     pip install -e . --no-deps
#
# `--no-deps` matters: without it pip re-resolves and may lift a pin.
#
# Python 3.12.3 on win32. Every run also records its own library versions in
# analysis_runs.lib_versions, so a number traces to versions even if this file
# has moved on since.

